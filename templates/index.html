<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lokal Medya İndirici</title>
    <style>
        :root {
            --background-color: #15202b;
            --container-bg: #192734;
            --text-color: #ffffff;
            --text-muted: #8899a6;
            --accent-color: #1d9bf0;
            --accent-hover: #1a8cd8;
            --border-color: #38444d;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--background-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 15px;
            box-sizing: border-box;
        }
        .container {
            background: var(--container-bg);
            padding: 25px 30px;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.2);
            text-align: center;
            width: 100%;
            max-width: 500px;
            border: 1px solid var(--border-color);
        }
        h1 {
            margin-top: 0;
            margin-bottom: 25px;
            font-size: 24px;
        }
        .input-wrapper {
            position: relative;
        }
        #tweet-url {
            width: 100%;
            padding: 12px 40px 12px 12px;
            border: 1px solid var(--border-color);
            background-color: var(--background-color);
            color: var(--text-color);
            border-radius: 8px;
            box-sizing: border-box;
            transition: all 0.2s;
            font-size: 16px;
        }
        #tweet-url:focus {
            outline: none;
            border-color: var(--accent-color);
            box-shadow: 0 0 0 3px rgba(29, 155, 240, 0.3);
        }
        #clear-button {
            position: absolute; right: 10px; top: 50%;
            transform: translateY(-50%); background: transparent; border: none;
            font-size: 22px; color: var(--text-muted); cursor: pointer; display: none;
        }
        .button-group {
            display: flex; gap: 10px; margin-top: 15px;
        }
        button {
            flex-grow: 1; padding: 12px 20px; background-color: var(--accent-color);
            color: white; border: none; border-radius: 8px; cursor: pointer;
            font-size: 16px; font-weight: bold; transition: background-color 0.2s;
        }
        button:hover { background-color: var(--accent-hover); }
        #paste-button {
            flex-grow: 0; background-color: #38444d;
        }
        #paste-button:hover { background-color: #536471; }
        
        #result-area {
            margin-top: 25px;
            min-height: 50px;
            width: 100%;
        }
        /* YENİ: Video Önizleme Stilleri */
        #video-preview {
            width: 100%;
            border-radius: 12px;
            margin-top: 20px;
            background-color: #000;
        }
        /* YENİ: İndirme Butonu Stili */
        #download-video-button {
            width: 100%;
            margin-top: 15px;
            background-color: #00ba7c; /* Yeşil renk */
        }
        #download-video-button:hover {
            background-color: #00a068;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Medya İndirici</h1>
        <form id="download-form">
            <div class="input-wrapper">
                <input type="text" id="tweet-url" placeholder="Linki buraya yapıştırın..." required>
                <button type="button" id="clear-button" title="Temizle">&times;</button>
            </div>
            <div class="button-group">
                <button type="button" id="paste-button">Yapıştır</button>
                <button type="submit">Getir</button>
            </div>
        </form>
        <div id="result-area"></div>
    </div>

    <script>
        const form = document.getElementById('download-form');
        const urlInput = document.getElementById('tweet-url');
        const resultArea = document.getElementById('result-area');
        const pasteButton = document.getElementById('paste-button');
        const clearButton = document.getElementById('clear-button');

        pasteButton.addEventListener('click', async () => {
            try {
                const text = await navigator.clipboard.readText();
                urlInput.value = text;
                clearButton.style.display = 'block';
                resultArea.innerHTML = '';
            } catch (err) {
                resultArea.innerHTML = `<p style="color: #ff4d4d;">Tarayıcı panoya erişim izni vermedi.</p>`;
            }
        });

        clearButton.addEventListener('click', () => {
            urlInput.value = '';
            clearButton.style.display = 'none';
        });

        urlInput.addEventListener('input', () => {
            clearButton.style.display = urlInput.value ? 'block' : 'none';
        });

        form.addEventListener('submit', async function(event) {
            event.preventDefault();
            const url = urlInput.value;
            resultArea.innerHTML = '<i>Lütfen bekleyin, medya getiriliyor...</i>';

            try {
                const response = await fetch('/download', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url: url })
                });
                const data = await response.json();

                if (response.ok) {
                    // YENİ: Başarılı olursa, video önizlemesi ve indirme butonu oluştur
                    resultArea.innerHTML = `
                        <video id="video-preview" src="${data.media_url}" controls autoplay muted playsinline></video>
                        <div class="button-group">
                            <button id="download-video-button">Videoyu İndir</button>
                        </div>
                    `;
                    
                    document.getElementById('download-video-button').addEventListener('click', () => {
                        downloadVideo(data.media_url, `video_${new Date().getTime()}.mp4`);
                    });

                } else {
                    resultArea.innerHTML = `<p style="color: #ff4d4d;"><strong>Hata:</strong> ${data.error}</p>`;
                }
            } catch (error) {
                resultArea.innerHTML = `<p style="color: #ff4d4d;"><strong>Sunucuya bağlanırken bir hata oluştu.</strong></p>`;
            }
        });

        // YENİ: Videoyu indirmek için en gelişmiş yöntem
        async function downloadVideo(url, filename) {
            resultArea.innerHTML += '<p><i>Video indiriliyor, lütfen bekleyin... Bu işlem uzun sürebilir.</i></p>';
            try {
                const response = await fetch(url);
                const blob = await response.blob();
                const blobUrl = window.URL.createObjectURL(blob);
                
                const a = document.createElement('a');
                a.style.display = 'none';
                a.href = blobUrl;
                a.download = filename;
                document.body.appendChild(a);
                a.click();
                window.URL.revokeObjectURL(blobUrl);
                document.body.removeChild(a);

                resultArea.innerHTML += '<p style="color: #00ba7c;">İndirme tamamlandı! Safari\'nin indirme yöneticisini kontrol edin.</p>';

            } catch(e) {
                resultArea.innerHTML += `<p style="color: #ff4d4d;"><strong>İndirme sırasında hata:</strong> Tarayıcı dosyayı indiremedi.</p>`;
            }
        }
    </script>
</body>
</html>
